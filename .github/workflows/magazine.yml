name: Monthly Magazine Generation

on:
  schedule:
    # Run at 00:00 UTC on the 28th of every month
    - cron: '0 0 28 * *'
  workflow_dispatch:
    # Allow manual triggers from the GitHub UI

jobs:
  generate_magazine:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Magazine PDF
        env:
          # Required connection strings (must be set in GitHub Repository Secrets)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -m services.nlp.magazine_generator
