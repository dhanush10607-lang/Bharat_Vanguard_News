name: Generate Daily Podcast

on:
  schedule:
    - cron: '30 2 * * *'  # 8:00 AM IST (Morning)
    - cron: '30 8 * * *'  # 2:00 PM IST (Afternoon)
    - cron: '30 12 * * *' # 6:00 PM IST (Evening)
  workflow_dispatch: # Allows manual trigger

jobs:
  generate-podcast:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the new mp3 back to the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-nlp.txt

      - name: Run Podcast Generator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENVIRONMENT: production
          TZ: 'Asia/Kolkata'
        run: |
          python -m services.ai.generate_podcast

      - name: Commit and push new podcast
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/public/podcast/
          # Only commit and push if the file actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate daily podcast" && git pull --rebase && git push)
