# ============================================================
#  Bharat Vanguard News (BVN) — Render Deployment Config (render.yaml)
#  Deploys the FastAPI backend to Render's free tier.
#  Docs: https://render.com/docs/blueprint-spec
# ============================================================

services:
  # ── FastAPI API Server ──────────────────────────────────────
  - type: web
    name: bvn-api
    runtime: python
    region: oregon
    plan: free               # Free tier: 512MB RAM, 0.1 CPU, sleeps after 15min
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        sync: false          # Set in Render Dashboard → Environment
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true  # Render auto-generates a secure value
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel domain: https://bharatvanguard.news

