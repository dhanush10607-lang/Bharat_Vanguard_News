<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 50" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .brand-main { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #FFFFFF; letter-spacing: 0.5px; }
      .brand-sub { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 300; fill: #94A3B8; letter-spacing: 0.5px; }
      .news-badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 800; fill: #FFFFFF; letter-spacing: 1.5px; }
    </style>
  </defs>

  <!-- Vanguard Shield & Speed Mark -->
  <g transform="translate(2, 5)">
    <!-- Outer Dark Shield Frame -->
    <path d="M 20 2 L 36 8 V 22 C 36 32 20 38 20 38 C 20 38 4 32 4 22 V 8 L 20 2 Z" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <!-- Saffron Chevron -->
    <path d="M 12 13 L 21 20 L 12 27 L 16 27 L 25 20 L 16 13 Z" fill="#FF9933"/>
    <!-- Green Chevron -->
    <path d="M 18 13 L 27 20 L 18 27 L 22 27 L 31 20 L 22 13 Z" fill="#16A34A"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="48" y1="12" x2="48" y2="38" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Brand Name + News Badge -->
  <g transform="translate(60, 0)">
    <!-- BHARAT -->
    <text x="0" y="33" class="brand-main">BHARAT</text>
    
    <!-- VANGUARD -->
    <text x="96" y="33" class="brand-sub">VANGUARD</text>

    <!-- NEWS Red Pill Badge -->
    <rect x="222" y="16" width="54" height="20" rx="4" fill="#EF4444"/>
    <text x="229" y="30" class="news-badge-text">NEWS</text>
  </g>
</svg>
